<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบธุรการ - กองประชาสัมพันธ์</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --bs-primary-rgb: 13, 110, 253; }
    body { background-color: #f8f9fa; font-size: 0.95rem; color: #333; }
    .navbar { box-shadow: 0 2px 4px rgba(0,0,0,.08); }
    .pane { display: none; }
    .pane.on { display: block; }
    /* ปรับแต่งแท็บให้เลื่อนแนวนอนได้ดีบนมือถือ */
    #tabs-container {
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; /* Firefox */
    }
    #tabs-container::-webkit-scrollbar { display: none; /* Chrome/Safari */ }
    #tabs .nav-link {
      border-radius: 50rem;
      padding: 0.5rem 1rem;
      font-weight: 500;
      color: #495057;
      background: #e9ecef;
      margin-right: 0.5rem;
    }
    #tabs .nav-link.active {
      color: #fff;
      background-color: #0d6efd;
      box-shadow: 0 2px 6px rgba(13,110,253,.3);
    }
    .stat-card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
      transition: transform 0.2s;
    }
    .big-num { font-size: 1.8rem; font-weight: 700; line-height: 1.1; }
    .table-container { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.05); overflow: hidden; }
    /* ปุ่มและฟิลด์ให้กดง่ายบนมือถือ */
    .btn, .form-control, .form-select { border-radius: 8px; padding: 0.55rem 0.75rem; }
  </style>
</head>
<body>

  <!-- Navbar ด้านบน -->
  <nav class="navbar navbar-dark bg-primary sticky-top">
    <div class="container-fluid px-3">
      <span class="navbar-brand mb-0 h6 fw-bold"><i class="bi bi-shield-lock-fill me-1"></i> ธุรการ กปส.</span>
      <div id="who" class="text-white-50 small text-end">กำลังโหลด...</div>
    </div>
  </nav>

  <!-- เนื้อหาหลัก -->
  <main class="container py-3 px-2 px-md-3">
    <!-- กล่องแจ้งสถานะ -->
    <div id="msg" class="alert alert-primary shadow-sm" role="alert">
      <div class="spinner-border spinner-border-sm me-2" role="status"></div> กำลังเชื่อมต่อระบบ...
    </div>

    <!-- ส่วนเนื้อหาหลักหลังโหลดผ่าน -->
    <div id="app" class="d-none">
      <!-- เมนูแท็บแบบเลื่อนได้ -->
      <div id="tabs-container" class="mb-3 pb-1">
        <ul id="tabs" class="nav nav-pills flex-nowrap d-inline-flex">
          <li class="nav-item"><button class="nav-link" data-tab="strength" data-perm="strength.view"><i class="bi bi-pie-chart-fill me-1"></i> กำลังพล</button></li>
          <li class="nav-item"><button class="nav-link" data-tab="wfh" data-perm="duty.manage"><i class="bi bi-house-door-fill me-1"></i> WFH</button></li>
          <li class="nav-item"><button class="nav-link" data-tab="duty" data-perm="duty.manage"><i class="bi bi-journal-text me-1"></i> สถานะพิเศษ</button></li>
          <li class="nav-item"><button class="nav-link" data-tab="holiday" data-perm="holiday.manage"><i class="bi bi-calendar-event-fill me-1"></i> วันหยุด</button></li>
          <li class="nav-item"><button class="nav-link" data-tab="unit" data-perm="duty.manage"><i class="bi bi-building-gear me-1"></i> ตั้งค่าแผนก</button></li>
        </ul>
      </div>

      <!-- แท็บที่ 1: ยอดกำลังพล -->
      <section id="pane-strength" class="pane">
        <div class="card border-0 shadow-sm mb-3 rounded-4 p-3 bg-white">
          <div class="row g-2 align-items-center">
            <div class="col-7 col-sm-auto">
              <input type="date" id="stDate" class="form-control form-control-sm">
            </div>
            <div class="col-5 col-sm-auto">
              <button id="stGo" class="btn btn-primary btn-sm w-100"><i class="bi bi-search me-1"></i> แสดงข้อมูล</button>
            </div>
          </div>
        </div>
        <div id="stOut"></div>
      </section>

      <!-- แท็บเตรียมไว้สำหรับขั้นตอนถัดไป -->
      <section id="pane-wfh" class="pane"><div class="alert alert-info border-0 shadow-sm">แท็บตาราง WFH จะพร้อมใช้งานในขั้นตอนถัดไปครับ</div></section>
      <section id="pane-duty" class="pane"><div class="alert alert-info border-0 shadow-sm">แท็บสถานะพิเศษจะพร้อมใช้งานในขั้นตอนถัดไปครับ</div></section>
      <section id="pane-holiday" class="pane"><div class="alert alert-info border-0 shadow-sm">แท็บวันหยุดจะพร้อมใช้งานในขั้นตอนถัดไปครับ</div></section>
      <section id="pane-unit" class="pane"><div class="alert alert-info border-0 shadow-sm">แท็บตั้งค่าแผนกจะพร้อมใช้งานในขั้นตอนถัดไปครับ</div></section>
    </div>
  </main>

<script>
  // ===== ตั้งค่าระบบ (ดึงค่าจากที่ตั้งค่าไว้เดิม) =====
  const LIFF_ID = '2012347393-9duzGDMx'; // LIFF ID ของคุณ
  const API_URL = 'https://script.google.com/macros/s/AKfycbxbHMFCz8B0PGPAka9h6yawBs8fxxUUrgKt_q1XweY/exec'; // URL Web App ของคุณ

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const today = () => { const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const say = (type, text) => { const m = $('msg'); m.className = 'alert alert-' + type + ' shadow-sm'; m.innerHTML = text; };
  let ME = null;
  const can = k => !!ME && (ME.permissions.includes('*') || ME.permissions.includes(k));

  async function api(action, payload) {
    let res, j;
    try {
      res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, payload: payload || {}, idToken: liff.getIDToken() })
      });
    } catch (e) { throw new Error('ติดต่อเซิร์ฟเวอร์ไม่ได้'); }
    try { j = await res.json(); } catch (e) { throw new Error('รูปแบบข้อมูลตอบกลับไม่ถูกต้อง'); }
    if (!j.ok) { const e = new Error(j.error.message); e.code = j.error.code; throw e; }
    return j.data;
  }

  function openTab(name) {
    document.querySelectorAll('#tabs .nav-link').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'pane-' + name));
    if (name === 'strength' && !$('stOut').dataset.loaded) loadStrength();
  }

  // โหลดข้อมูลยอดกำลังพล
  async function loadStrength() {
    const out = $('stOut');
    out.dataset.loaded = '1';
    out.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div><div class="small text-muted mt-2">กำลังประมวลผลข้อมูล...</div></div>';
    try {
      const s = await api('strength.get', { date: $('stDate').value });
      const w = esc(s.unit_word);
      const G = { ONSITE: 'ณ ที่ตั้ง', OUTSIDE: 'นอกที่ตั้ง', ABSENT: 'ไม่อยู่' };
      const card = (t, n, c, icon) => `
        <div class="col-6 col-md-3">
          <div class="card stat-card p-3 bg-white h-100 border-start border-4 border-${c}">
            <div class="small text-muted mb-1"><i class="bi bi-${icon} me-1"></i>${t}</div>
            <div class="big-num text-${c}">${n}</div>
            <div class="text-secondary" style="font-size: 0.8rem;">${w}</div>
          </div>
        </div>`;
      
      out.innerHTML = `
        <div class="d-flex align-items-center justify-content-between mb-3 px-1">
          <h6 class="fw-bold mb-0 text-dark"><i class="bi bi-calendar3 me-2 text-primary"></i>${esc(s.label)}</h6>
          ${s.workday ? '' : '<span class="badge bg-secondary">วันหยุดราชการ</span>'}
        </div>
        <div class="row g-2 mb-3">
          ${card('ยอดกำลังพลรวม', s.total, 'dark', 'people')}
          ${card('ปฏิบัติงาน ณ ที่ตั้ง', s.groups.ONSITE, 'success', 'building-check')}
          ${card('ปฏิบัติงานนอกที่ตั้ง', s.groups.OUTSIDE, 'primary', 'geo-alt')}
          ${card('ไม่อยู่ / ลา', s.groups.ABSENT, 'danger', 'person-dash')}
        </div>
        
        <div class="card border-0 shadow-sm rounded-4 mb-3 bg-white">
          <div class="card-header bg-transparent fw-bold py-3 border-0"><i class="bi bi-list-check me-2 text-primary"></i>รายละเอียดสถานะพิเศษประจำวัน</div>
          <ul class="list-group list-group-flush small">
            ${s.by_type.length ? s.by_type.map(t => `
              <li class="list-group-item py-2 px-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <span class="fw-bold text-dark">${esc(t.name)}</span>
                  <span class="badge bg-light text-dark border">${t.people.length} ${w} (${G[t.group] || ''})</span>
                </div>
                <div class="text-muted" style="font-size: 0.85rem;">${t.people.map(esc).join(', ')}</div>
              </li>`).join('')
              : '<li class="list-group-item text-muted text-center py-3">ไม่มีผู้มีสถานะพิเศษในวันนี้ ทุกคนปฏิบัติงานตามปกติ</li>'}
          </ul>
        </div>

        <div class="card border-0 shadow-sm rounded-4 bg-white mb-4">
          <div class="card-header bg-transparent fw-bold py-3 border-0"><i class="bi bi-buildings me-2 text-primary"></i>สรุปแยกตามแผนก</div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 small text-center">
              <thead class="table-light">
                <tr><th class="text-start ps-3">แผนก</th><th>ทั้งหมด</th><th>ณ ที่ตั้ง</th><th>นอกที่ตั้ง</th><th>ไม่อยู่</th></tr>
              </thead>
              <tbody>
                ${s.by_unit.map(u => `
                  <tr>
                    <td class="text-start ps-3 fw-medium">${esc(u.name)}</td>
                    <td><span class="badge bg-secondary bg-opacity-10 text-secondary">${u.total}</span></td>
                    <td class="text-success fw-bold">${u.ONSITE}</td>
                    <td class="text-primary">${u.OUTSIDE}</td>
                    <td class="text-danger">${u.ABSENT}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>`;
    } catch (e) {
      out.innerHTML = `<div class="alert alert-danger border-0 shadow-sm">${esc(e.message)}</div>`;
    }
  }

  async function main() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      ME = await api('me.get');
      if (!ME.registered) { say('warning', '<i class="bi bi-exclamation-triangle-fill me-1"></i> บัญชี LINE นี้ยังไม่ได้ลงทะเบียนในระบบ'); return; }
      if (!can('duty.manage') && !can('holiday.manage')) { say('danger', '<i class="bi bi-slash-circle-fill me-1"></i> บัญชีนี้ไม่มีสิทธิ์เข้าใช้งานหน้าธุรการ'); return; }
      
      $('who').textContent = ME.person.name;
      let first = '';
      document.querySelectorAll('#tabs .nav-link').forEach(b => {
        if (!can(b.dataset.perm)) { b.parentElement.remove(); return; }
        b.onclick = () => openTab(b.dataset.tab);
        first = first || b.dataset.tab;
      });
      $('stDate').value = today();
      $('stGo').onclick = loadStrength;
      $('msg').className = 'd-none';
      $('app').classList.remove('d-none');
      openTab(first);
    } catch (e) {
      say('danger', '<i class="bi bi-wifi-off me-1"></i> เชื่อมต่อระบบไม่สำเร็จ: ' + e.message);
    }
  }
  main();
</script>
</body>
</html>
